<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미니어처 변경 전후</title><style>body{margin:0;background:#eae6dc;color:#263c35;font:16px system-ui}main{max-width:1440px;margin:24px auto;padding:0 20px}h1{font-size:24px}p{color:#63716a}button{font:inherit;padding:10px 22px;border:1px solid #acb8ae;border-radius:9px;background:#faf8f1;cursor:pointer;margin:0 8px 14px 0}button[aria-pressed=true]{background:#286c61;color:white}.stage{position:relative}.stage img{width:100%;display:block}.stage img:last-child{position:absolute;inset:0;visibility:hidden}.stage.after img:last-child{visibility:visible}</style><main><h1>같은 구도에서 변경 전후</h1><p>버튼으로 전환해 보세요. 한강 색, 나무 형태, 화면 위아래의 흐림이 주된 차이입니다.</p><button aria-pressed="true" onclick="show(false)">변경 전</button><button aria-pressed="false" onclick="show(true)">변경 후</button><div class="stage"><img src="miniature-before.png" alt="변경 전 서울 전체 화면"><img src="miniature-final.png" alt="변경 후 서울 전체 화면"></div></main><script>function show(after){document.querySelector('.stage').classList.toggle('after',after);document.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===Number(after))))}</script></html>
