<!doctype html><html lang="ko"><meta charset="utf-8"><title>랜드마크 모형 검수</title><style>body{margin:0;background:#edf3ee;color:#254b42;font:14px system-ui}canvas{display:block}#names{position:absolute;inset:0;pointer-events:none}.name{position:absolute;width:400px;text-align:center;font-weight:700}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script><div id="names"></div><script type="module">
import * as THREE from 'three';import {landmarksOf,buildLandmark} from '../landmarks.js';
const city=new URLSearchParams(location.search).get('city')||'seoul';const list=landmarksOf(city);const rows=Math.ceil(list.length/3),W=1200,H=rows*300;
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;renderer.setScissorTest(true);document.body.append(renderer.domElement);
window.report=[];
for(let i=0;i<list.length;i++){
 const lm=list[i],obj=buildLandmark(lm,'day'),scene=new THREE.Scene();scene.background=new THREE.Color('#edf3ee');
 const bounds=new THREE.Box3().setFromObject(obj),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());const scale=112/Math.max(size.x,size.y,size.z);obj.scale.setScalar(scale);obj.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);scene.add(obj);
 const light=new THREE.DirectionalLight('#ffffff',2.6);light.position.set(-100,180,100);scene.add(light,new THREE.HemisphereLight('#ffffff','#e6eee0',1.35),new THREE.AmbientLight('#ffffff',.35));
 const camera=new THREE.OrthographicCamera(-92,92,69,-69,1,1000);camera.position.set(155,135,190);camera.lookAt(0,48,0);
 const x=i%3*400,y=H-(Math.floor(i/3)+1)*300;renderer.setViewport(x,y,400,300);renderer.setScissor(x,y,400,300);renderer.render(scene,camera);
 let triangles=0;obj.traverse(o=>{if(o.isMesh)triangles+=o.geometry.attributes.position.count/3});window.report.push({id:lm.id,meshes:obj.children.length,triangles,top:obj.userData.top,valid:Number.isFinite(size.length())&&size.length()>0});
 const name=document.createElement('div');name.className='name';name.style.left=x+'px';name.style.top=(Math.floor(i/3)*300+278)+'px';name.textContent=lm.name;document.querySelector('#names').append(name);
}
window.ready=true;
</script></html>
